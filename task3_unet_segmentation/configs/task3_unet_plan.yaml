# U-Net experiment plan for Stanford Background Dataset.
# All experiments train from random initialization. No pretrained weights are used.
experiments:
  - name: 01_unet_ce
    loss: ce
    epochs: 80
    batch_size: 8
    image_size: 256
    base_channels: 32
    lr: 0.0003
    weight_decay: 0.0001
    notes: Cross-Entropy Loss only.

  - name: 02_unet_dice
    loss: dice
    epochs: 80
    batch_size: 8
    image_size: 256
    base_channels: 32
    lr: 0.0003
    weight_decay: 0.0001
    notes: Manually implemented Dice Loss only.

  - name: 03_unet_ce_dice
    loss: ce_dice
    epochs: 80
    batch_size: 8
    image_size: 256
    base_channels: 32
    lr: 0.0003
    weight_decay: 0.0001
    ce_weight: 1.0
    dice_weight: 1.0
    notes: Cross-Entropy + Dice Loss.
